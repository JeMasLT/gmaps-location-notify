<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tone Tester</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #1d2330; --muted: #5d6677;
    --border: #d8dce3; --accent: #2563eb; --accent-fg: #ffffff; --code: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --fg: #e6e9ef; --muted: #9aa3b2;
      --border: #333a45; --accent: #4f8cff; --accent-fg: #0b0e13; --code: #262b34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
  }
  main {
    max-width: 560px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  .row { display: grid; grid-template-columns: 130px 1fr 90px; gap: 12px; align-items: center; margin-bottom: 14px; }
  .row label { font-weight: 600; }
  .row label small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
  input[type=number] {
    width: 100%; padding: 6px 8px; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .spacer { grid-column: 2; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  }
  button:hover { border-color: var(--accent); }
  #test {
    width: 100%; padding: 14px; font-size: 1.15rem; font-weight: 700;
    background: var(--accent); color: var(--accent-fg); border: none;
  }
  #test:hover { filter: brightness(1.08); }
  .config { display: flex; gap: 8px; margin-top: 18px; }
  .config input {
    flex: 1; min-width: 0; padding: 8px 10px; font: 14px ui-monospace, Consolas, monospace;
    background: var(--code); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
  }
  .config input, .config textarea {
    flex: 1; min-width: 0; padding: 8px 10px; font: 14px ui-monospace, Consolas, monospace;
    background: var(--code); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; resize: none;
  }
  .config button { align-self: flex-start; }
  fieldset.group { border: 1px solid var(--border); border-radius: 8px; padding: 12px 12px 4px; margin: 6px 0 0; }
  fieldset.group legend { padding: 0 6px; font-weight: 600; color: var(--muted); font-size: .9rem; }
  fieldset.group .row { margin-bottom: 4px; }
  .note { margin: 0 0 8px; color: var(--muted); font-size: .82rem; }
  #status { margin-top: 10px; color: var(--muted); font-size: .85rem; min-height: 1.2em; }
  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr 90px; }
    .row label { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main>
  <h1>Tone Tester</h1>
  <p class="sub">Try beep settings by ear before putting them into <code>maps-location-notify.user.js</code>.</p>

  <div class="row">
    <label for="freqR">freq <small>Hz</small></label>
    <input type="range" id="freqR" min="100" max="3000" step="10">
    <input type="number" id="freqN" min="100" max="3000" step="1">
  </div>
  <div class="row">
    <label for="durR">durationMs <small>ms</small></label>
    <input type="range" id="durR" min="50" max="2000" step="10">
    <input type="number" id="durN" min="50" max="2000" step="1">
  </div>
  <div class="row">
    <label for="repN">repeat <small>1–10</small></label>
    <span></span>
    <input type="number" id="repN" min="1" max="10" step="1">
  </div>
  <div class="row">
    <label for="volR">VOLUME <small>0–1</small></label>
    <input type="range" id="volR" min="0" max="1" step="0.05">
    <input type="number" id="volN" min="0" max="1" step="0.05">
  </div>
  <div class="row">
    <label for="gapR">GAP_MS <small>between beeps</small></label>
    <input type="range" id="gapR" min="0" max="1000" step="10">
    <input type="number" id="gapN" min="0" max="2000" step="1">
  </div>

  <fieldset class="group">
    <legend>Script settings</legend>
    <div class="row">
      <label for="panelN">PANEL_LOST_MS <small>ms</small></label>
      <span></span>
      <input type="number" id="panelN" min="0" max="600000" step="100">
    </div>
    <p class="note">How long the Maps panel may be missing before notifications switch off. Doesn't affect the test sound.</p>
  </fieldset>

  <div class="presets">
    <button data-preset="default">Default (440 Hz, 250 ms, x1)</button>
    <button data-preset="special">Special street (1200 Hz, 300 ms, x2)</button>
    <button id="reset">Reset to defaults</button>
  </div>

  <button id="test">▶ Test</button>

  <div class="config">
    <input id="cfg" readonly aria-label="Config object">
    <button id="copy">Copy</button>
  </div>
  <div class="config">
    <textarea id="consts" readonly rows="3" aria-label="Script constants"></textarea>
    <button id="copyConsts">Copy</button>
  </div>
  <div id="status"></div>
</main>

<script>
  const PRESETS = {
    default: { freq: 440, durationMs: 250, repeat: 1 },
    special: { freq: 1200, durationMs: 300, repeat: 2 },
  };
  const $ = id => document.getElementById(id);
  const pairs = [['freqR', 'freqN'], ['durR', 'durN'], ['volR', 'volN'], ['gapR', 'gapN']];

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function num(id) {
    const el = $(id);
    const v = parseFloat(el.value);
    return isNaN(v) ? parseFloat(el.min) : clamp(v, parseFloat(el.min), parseFloat(el.max));
  }
  function values() {
    return {
      tone: { freq: Math.round(num('freqN')), durationMs: Math.round(num('durN')), repeat: Math.round(num('repN')) },
      volume: Math.round(num('volN') * 100) / 100,
      gap: Math.round(num('gapN')),
    };
  }
  function render() {
    const { tone, volume, gap } = values();
    $('cfg').value = `{ freq: ${tone.freq}, durationMs: ${tone.durationMs}, repeat: ${tone.repeat} }`;
    $('consts').value =
      `const VOLUME = ${volume};\nconst GAP_MS = ${gap};\nconst PANEL_LOST_MS = ${Math.round(num('panelN'))};`;
  }
  function set(t) {
    if (t.freq != null) { $('freqN').value = t.freq; $('freqR').value = t.freq; }
    if (t.durationMs != null) { $('durN').value = t.durationMs; $('durR').value = t.durationMs; }
    if (t.repeat != null) $('repN').value = t.repeat;
    if (t.volume != null) { $('volN').value = t.volume; $('volR').value = t.volume; }
    if (t.gap != null) { $('gapN').value = t.gap; $('gapR').value = t.gap; }
    if (t.panelLost != null) $('panelN').value = t.panelLost;
    render();
  }
  const DEFAULTS = { freq: 440, durationMs: 250, repeat: 1, volume: 0.3, gap: 150, panelLost: 3000 };

  pairs.forEach(([r, n]) => {
    $(r).addEventListener('input', () => { $(n).value = $(r).value; render(); });
    $(n).addEventListener('input', () => { $(r).value = $(n).value; render(); });
  });
  $('repN').addEventListener('input', render);
  document.querySelectorAll('[data-preset]').forEach(b =>
    b.addEventListener('click', () => set(PRESETS[b.dataset.preset])));

  // --- Audio: identical to the userscript ---
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(tone, VOLUME, GAP_MS) {
    const ctx = ensureAudio();
    const dur = tone.durationMs / 1000;
    const step = (tone.durationMs + GAP_MS) / 1000;
    let t = ctx.currentTime + 0.02;
    for (let i = 0; i < (tone.repeat || 1); i++, t += step) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = tone.freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(VOLUME, t + 0.01);
      gain.gain.setValueAtTime(VOLUME, t + dur - 0.02);
      gain.gain.linearRampToValueAtTime(0, t + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.01);
    }
  }

  $('test').addEventListener('click', () => {
    const { tone, volume, gap } = values();
    beep(tone, volume, gap);
    $('status').textContent = `Playing… (audio: ${audioCtx.state})`;
    setTimeout(() => { $('status').textContent = `Audio: ${audioCtx.state}`; }, 300);
  });

  function wireCopy(btnId, srcId) {
    $(btnId).addEventListener('click', async () => {
      const text = $(srcId).value;
      try { await navigator.clipboard.writeText(text); }
      catch { $(srcId).select(); document.execCommand('copy'); }
      $(btnId).textContent = 'Copied!';
      setTimeout(() => { $(btnId).textContent = 'Copy'; }, 1200);
    });
  }
  wireCopy('copy', 'cfg');
  wireCopy('copyConsts', 'consts');
  $('panelN').addEventListener('input', render);
  $('reset').addEventListener('click', () => set(DEFAULTS));

  set(DEFAULTS);
</script>
</body>
</html>
